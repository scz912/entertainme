<!DOCTYPE html>
<html>

<head>
  <title>EntertainMe - Edit Profile</title>

</head>

<body>
  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">

      <!-- LOGO -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">EntertainMe</span>
      </a>

      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-center">
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link" href="home.html">
              <i class="bi bi-house"></i>
              <span>Home</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <i class="bi bi-search"></i>
              <span>Search</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="watchlist.html">
              <i class="bi bi-bookmark"></i>
              <span>Watchlist</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="profile.html">
              <i class="bi bi-person"></i>
              <span>Profile</span>
            </a>
          </li>

        </ul>
      </div>

      <!-- LOGOUT -->
      <button class="btn btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>

    </div>
  </nav>

  <div class="d-flex justify-content-center align-items-center profile-page-wrap">
    <div style="width: 100%; max-width: 420px;">
      <div class="auth-card profile-card">
        <a class="profile-back-btn" href="profile.html">
          <i class="bi bi-arrow-left"></i>
          Back
        </a>

        <div class="profile-header">
          <div class="profile-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <h4>Edit Profile</h4>
          <p>Update your profile details and password</p>
        </div>

        <div class="text-start small opacity-50">Name</div>
        <div class="input-group-custom">
          <input type="text" id="name" placeholder="Name">
        </div>

        <div class="text-start small opacity-50">Email</div>
        <div class="input-group-custom input-readonly">
          <input type="email" id="email" placeholder="Email" disabled>
        </div>
        <div class="readonly-helper">Email cannot be changed</div>

        <div class="text-start small opacity-50">Phone</div>
        <div class="input-group-custom">
          <input type="text" id="phone" placeholder="Phone">
        </div>

        <button class="btn-auth w-100 mt-3" onclick="saveProfile()">Save Changes</button>

        <hr class="my-4">

        <h5 class="text-center mb-3">Change Password</h5>

        <div class="password-field input-group-custom">
          <i class="bi bi-lock-fill password-lock-icon"></i>
          <input type="password" id="oldPassword" placeholder="Current Password">
          <button class="password-toggle" type="button" onclick="togglePasswordVisibility('oldPassword', this)"
            aria-label="Show current password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="password-field input-group-custom">
          <i class="bi bi-lock-fill password-lock-icon"></i>
          <input type="password" id="newPassword" placeholder="New Password">
          <button class="password-toggle" type="button" onclick="togglePasswordVisibility('newPassword', this)"
            aria-label="Show new password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="password-field input-group-custom">
          <i class="bi bi-lock-fill password-lock-icon"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm New Password">
          <button class="password-toggle" type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            aria-label="Show confirm password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <button class="btn-auth w-100 mt-2" onclick="changePassword()">Update Password</button>
      </div>
    </div>
  </div>
