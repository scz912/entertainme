<!DOCTYPE html>
<html>

<head>
  <title>EntertainMe - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">EntertainMe</span>
      </a>

      <div class="collapse navbar-collapse justify-content-center">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="home.html"><i class="bi bi-house"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="search.html"><i class="bi bi-search"></i> Search</a></li>
          <li class="nav-item"><a class="nav-link" href="watchlist.html"><i class="bi bi-bookmark"></i> Watchlist</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
        </ul>
      </div>

      <button class="btn btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <!-- PROFILE CONTENT -->
  <div class="d-flex justify-content-center align-items-center profile-page-wrap">

    <div style="width: 100%; max-width: 420px;">

      <div class="auth-card profile-card">

        <div class="profile-header">
          <div class="profile-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <h4>My Profile</h4>
          <p>Manage your personal account information</p>
        </div>

        <!-- NAME -->
        <div class="text-start small opacity-50">Name</div>
        <div class="input-group-custom">
          <input type="text" id="name" disabled>
        </div>

        <!-- EMAIL -->
        <div class="text-start small opacity-50">Email</div>
        <div class="input-group-custom">
          <input type="email" id="email" disabled>
        </div>

        <!-- PHONE -->
        <div class="text-start small opacity-50">Phone</div>
        <div class="input-group-custom">
          <input type="text" id="phone" disabled>
        </div>

        <!-- BUTTONS -->
        <a class="btn-auth w-100 mt-3" href="editProfile.html">Edit Profile</a>

        <hr class="my-4">

        <!-- DELETE -->
        <button class="btn-delete-account w-100" onclick="openDeleteModal()">Delete Account</button>

      </div>

    </div>
  </div>

  <div class="delete-modal-overlay" id="deleteModal" aria-hidden="true">
    <div class="delete-modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <h4 id="deleteModalTitle">Delete Account</h4>
      <p>Are you sure you want to permanently delete your account?</p>
      <div class="delete-modal-actions">
        <button class="btn-modal-cancel" type="button" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-modal-delete" type="button" onclick="confirmDeleteAccount()">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
